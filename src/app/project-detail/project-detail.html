<!--
  Icon only: the label lives in aria-label/title, the arrow is decorative.
  Defined once here and rendered into whichever branch below applies.
-->
<ng-template #backLink>
  <a
    class="back"
    routerLink="/"
    [attr.aria-label]="t().backToProfile"
    [attr.title]="t().backToProfile"
  >
    <svg
      class="back-arrow"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
  </a>
</ng-template>

@if (project(); as project) {
  <ng-container [ngTemplateOutlet]="backLink" />
  <article class="detail">
    <!-- The reveal sits on the frame, so the image and its border fade in as
         one unit rather than the picture appearing inside a frame already there. -->
    <div class="hero-frame" appReveal>
      <!-- alt="" : decorative, the title follows immediately below. -->
      <!-- sizes mirrors .page's padding at each tier (app.css), capped at the
           1144px column the 1240px page allows. -->
      <img
        class="hero"
        [src]="project.banner"
        [attr.srcset]="project.bannerSrcset"
        sizes="(max-width: 600px) calc(100vw - 2rem), (max-width: 900px) calc(100vw - 3.5rem), (max-width: 1240px) calc(100vw - 6rem), 1144px"
        alt=""
        width="1200"
        height="400"
      />
    </div>

    <header class="detail-head" [appReveal]="1">
      <h1>{{ project.title }}</h1>
      <p class="meta">{{ project.role }} &middot; {{ project.year }}</p>
      <ul class="tags" [attr.aria-label]="t().technologiesUsed">
        @for (tag of project.tags; track tag) {
          <li>{{ tag }}</li>
        }
      </ul>

      <!-- Only when the entry has somewhere to point; url is optional. -->
      @if (project.url) {
        <a class="source" [href]="project.url" target="_blank" rel="noopener noreferrer">
          <svg
            class="source-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 17 17 7M9 7h8v8" />
          </svg>
          {{ linkLabel() }}
        </a>
      }
    </header>

    <div class="markdown-body" [appReveal]="2" [innerHTML]="project.body | markdown"></div>
  </article>
} @else {
  <ng-container [ngTemplateOutlet]="backLink" />
  <div class="missing">
    <h1>{{ t().projectNotFound }}</h1>
    <p>{{ t().noProjectMatching(slug()) }}</p>
  </div>
}
