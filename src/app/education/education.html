<section class="education" aria-labelledby="education-heading">
  <h2 id="education-heading" appReveal>{{ t().education }}</h2>

  <ul class="entries">
    @for (study of studies(); track study.slug) {
      <li class="entry" [appReveal]="$index + 1">
        <div class="entry-head">
          <h3>{{ study.degree }}</h3>
          <span class="dates">{{ study.dates }}</span>
        </div>
        <p class="org">{{ study.institution }}</p>
        <div class="markdown-body markdown-body--tight" [innerHTML]="study.body | markdown"></div>
      </li>
    }
  </ul>
</section>
