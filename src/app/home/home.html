<header class="masthead" appReveal>
  <div class="intro">
    <h1>Aleksa Lukic</h1>
    <p class="role">{{ t().role }}</p>
    <p class="tagline">{{ t().tagline }}</p>
  </div>

  <div class="portrait-frame">
    <!-- alt="" : decorative, the name sits directly beside it. -->
    <img class="portrait" [src]="portrait" alt="" width="400" height="500" />
  </div>
</header>

<main>
  <app-overview />
  <hr class="divider" appReveal />
  <app-skills />
  <hr class="divider" appReveal />
  <app-commercial-releases />
  <hr class="divider" appReveal />
  <app-projects />

  <!-- The divider is inside the guard too: without it, an empty Showcase
       section would leave two dividers stacked with nothing between them. -->
  @if (hasShowcase) {
    <hr class="divider" appReveal />
    <app-showcase />
  }

  <hr class="divider" appReveal />
  <app-experience />
  <hr class="divider" appReveal />
  <!-- Grouped so the warm ground below can anchor to the closing sections. -->
  <div class="foot">
    <app-education />
    <hr class="divider" appReveal />
    <app-certificates />

    <!-- The divider is inside the guard too: without it, an empty Downloads
         section would leave two dividers stacked with nothing between them. -->
    @if (hasDownloads) {
      <hr class="divider" appReveal />
      <app-downloads />
    }

    <hr class="divider" appReveal />
    <app-contact />
    <hr class="divider" appReveal />
    <app-contacts />
  </div>
</main>
